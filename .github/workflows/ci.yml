# Checks every push and pull request on both platforms Stackyard ships for:
# analyze, the unit and widget tests, and a debug build of the desktop app.
# Live tests (real downloads, simulators, your machine) stay local; see README → Tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Flutter version from .fvmrc
        shell: bash
        run: echo "FLUTTER=$(jq -r .flutter .fvmrc)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build the app
        shell: bash
        run: flutter build ${{ runner.os == 'macOS' && 'macos' || 'windows' }} --debug
